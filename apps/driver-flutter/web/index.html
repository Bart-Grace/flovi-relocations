<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Flovi Driver — browse available relocation gigs and book them in one tap.">
  <meta name="theme-color" content="#0b1220">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flovi Driver">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Flovi · Driver</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b1220; }
    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #93a4c3; background: #0b1220;
    }
    #boot .mark { font-size: 12px; letter-spacing: .3em; color: #60a5fa; }
    #boot .name { margin-top: .5rem; font-size: 1.25rem; font-weight: 600; color: #fff; }
    #boot .bar { margin-top: 1.25rem; width: 120px; height: 2px; background: #1e293b; overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 40%; background: #60a5fa; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  </style>
</head>
<body>
  <div id="boot">
    <div style="text-align:center">
      <div class="mark">FLOVI</div>
      <div class="name">Driver</div>
      <div class="bar"><i></i></div>
    </div>
  </div>

  <script>
    // Custom bootstrap instead of the generated flutter_bootstrap.js, for two reasons:
    // 1. NO serviceWorkerSettings — a service worker serves a stale build after every
    //    redeploy, and that failure surfaces minutes before a demo.
    // 2. onEntrypointLoaded lets us remove the branded loader at the right moment,
    //    instead of flashing a white page while the engine boots.
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        const boot = document.getElementById('boot');
        if (boot) boot.remove();
        await appRunner.runApp();
      }
    });
  </script>
</body>
</html>
